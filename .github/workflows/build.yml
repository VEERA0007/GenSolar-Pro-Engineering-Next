name: GenSolar Pro Engineering - Cross-platform CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gensolar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Analyze and test Dart source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Generate platform runners
        run: flutter create --platforms=android,ios,web,windows,macos,linux --org com.gensolar --project-name gensolar_pro_engineering .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart source
        run: dart format lib test
      - name: Analyze
        run: flutter analyze --fatal-warnings --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test --reporter expanded

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Android APK
            platform: android
            os: ubuntu-latest
          - label: Web
            platform: web
            os: ubuntu-latest
          - label: Linux desktop
            platform: linux
            os: ubuntu-latest
          - label: Windows desktop
            platform: windows
            os: windows-latest
          - label: macOS desktop
            platform: macos
            os: macos-latest
          - label: iOS (unsigned)
            platform: ios
            os: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Stamp unique build number
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("pubspec.yaml")
          source = path.read_text()
          source = __import__("re").sub(
              r"^version: .*",
              f"version: 1.0.0+{__import__('os').environ['GITHUB_RUN_NUMBER']}",
              source,
              count=1,
              flags=__import__("re").MULTILINE,
          )
          path.write_text(source)
          PY
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Generate platform runner
        shell: bash
        run: flutter create --platforms=${{ matrix.platform }} --org com.gensolar --project-name gensolar_pro_engineering .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android debug APK
        if: matrix.platform == 'android'
        run: flutter build apk --debug
      - name: Build web release
        if: matrix.platform == 'web'
        run: flutter build web --release
      - name: Build Linux release
        if: matrix.platform == 'linux'
        run: flutter build linux --release
      - name: Build Windows release
        if: matrix.platform == 'windows'
        run: flutter build windows --release
      - name: Build macOS release
        if: matrix.platform == 'macos'
        run: flutter build macos --release
      - name: Build iOS without code signing
        if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign
      - name: Upload Android APK
        if: success() && matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: GenSolar-Pro-Next-Android-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload web bundle
        if: success() && matrix.platform == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: GenSolar-Pro-Next-Web
          path: build/web/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux bundle
        if: success() && matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: GenSolar-Pro-Next-Linux
          path: build/linux/x64/release/bundle/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows bundle
        if: success() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: GenSolar-Pro-Next-Windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS bundle
        if: success() && matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: GenSolar-Pro-Next-macOS
          path: build/macos/Build/Products/Release/
          if-no-files-found: error
          retention-days: 14
      - name: Upload iOS build output (unsigned)
        if: success() && matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: GenSolar-Pro-Next-iOS-unsigned
          path: build/ios/iphoneos/Runner.app/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish successful builds to GitHub Releases
    needs: [validate, build]
    if: github.event_name != 'pull_request' && needs.validate.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package platform downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          apk="$(find artifacts/GenSolar-Pro-Next-Android-debug-APK -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" release-assets/GenSolar-Pro-Android-debug.apk
          for platform in Web Linux Windows macOS iOS-unsigned; do
            folder="artifacts/GenSolar-Pro-Next-${platform}"
            if [ -d "$folder" ]; then
              (cd "$folder" && zip -qr "../../release-assets/GenSolar-Pro-${platform}.zip" .)
            fi
          done
          ls -lh release-assets
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: GenSolar Pro build ${{ github.run_number }}
          body: |
            Automated cross-platform build from commit ${{ github.sha }}.

            Downloads are provided for Android (debug APK), Web, Linux, Windows, macOS and iOS (unsigned, for development only).
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
